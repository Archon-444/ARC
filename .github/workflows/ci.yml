name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18.x'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: ./apps/web
        run: npm ci

      - name: Lint
        working-directory: ./apps/web
        run: npm run lint

      - name: Type Check
        working-directory: ./apps/web
        run: npm run type-check

  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        working-directory: ./contracts
        run: npm ci

      - name: Test
        working-directory: ./contracts
        run: npm test

      - name: Coverage
        working-directory: ./contracts
        run: npm run coverage

      - uses: codecov/codecov-action@v3
        with:
          files: ./contracts/coverage/lcov.info
          flags: contracts

  test-web:
    name: Web App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: ./apps/web
        run: npm ci

      - name: Test
        working-directory: ./apps/web
        run: npm test
        env:
          CI: true

      - uses: codecov/codecov-action@v3
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: ./apps/web
        run: npm ci

      - name: Build
        working-directory: ./apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://arc.market

      - uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit Web App
        working-directory: ./apps/web
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit Contracts
        working-directory: ./contracts
        run: npm audit --audit-level=moderate
        continue-on-error: true
